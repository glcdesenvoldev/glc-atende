services:
  glc-atende:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glc-atende
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.glc-atende.rule: "Host(`atende.glcinternet.com.br`)"
      traefik.http.routers.glc-atende.entrypoints: "websecure"
      traefik.http.routers.glc-atende.tls: "true"
      traefik.http.routers.glc-atende.tls.certresolver: "letsencrypt"
      traefik.http.services.glc-atende.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ixc/webhook >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - glc-atende

networks:
  glc-atende:
    name: glc-atende
